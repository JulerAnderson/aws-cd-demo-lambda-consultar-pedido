AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Order tracking demo for AWS Community Day Peru 2026.

Resources:
  PedidosLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-consultar-pedido
      RetentionInDays: 7

  ConsultarPedidoRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EscribirLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt PedidosLogs.Arn

  ConsultarPedidoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-consultar-pedido
      Description: Consulta estado y fechas de entrega mediante pedido_id y DNI ficticio.
      CodeUri: src/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt ConsultarPedidoRole.Arn
      LoggingConfig:
        LogGroup: !Ref PedidosLogs
      Tags:
        Project: aws-cd-demo-lambda-consultar-pedido
        Component: consultar-pedido

Outputs:
  FunctionName:
    Description: Nombre para invocar la Lambda directamente.
    Value: !Ref ConsultarPedidoFunction
  FunctionArn:
    Description: ARN para identificar la Lambda en servicios como AgentCore Gateway.
    Value: !GetAtt ConsultarPedidoFunction.Arn
